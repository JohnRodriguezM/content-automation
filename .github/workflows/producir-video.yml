name: Producir videos

# Cada guion nuevo que entra a main se produce en paralelo (imágenes → voz → render)
# y el video + su descripción se suben a Google Drive, en una carpeta por fecha.
on:
  push:
    branches: [main]
    paths: ["guiones/*.json"]
  workflow_dispatch:
    inputs:
      guiones:
        description: "Guiones separados por espacio (ej. guiones/2026-11-06-netflix-dvd.json). Vacío = los del último commit"
        required: false
      estilo:
        description: "Estilo visual: mixto (por defecto) o tablero"
        required: false
        default: mixto

jobs:
  listar:
    runs-on: ubuntu-latest
    outputs:
      matriz: ${{ steps.lista.outputs.matriz }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 2 }
      - id: lista
        run: |
          if [ -n "${{ inputs.guiones }}" ]; then
            archivos="${{ inputs.guiones }}"
          else
            archivos=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'guiones/*.json' 2>/dev/null | tr '\n' ' ' || true)
          fi
          echo "matriz=$(printf '%s\n' $archivos | jq -R . | jq -sc 'map(select(length>0))')" >> "$GITHUB_OUTPUT"

  producir:
    needs: listar
    if: needs.listar.outputs.matriz != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        guion: ${{ fromJson(needs.listar.outputs.matriz) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }

      - run: npm ci
      - run: npx remotion browser ensure
      - name: Instalar ffmpeg (acelera la voz)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && ffmpeg -version | head -1

      - name: Instalar rclone (versión actual)
        run: curl -fsSL https://rclone.org/install.sh | sudo bash && rclone version

      - name: Validar
        run: npx tsx pipeline/validar.ts "${{ matrix.guion }}"

      # La voz se guarda en caché por guion + texto de la narración: si solo cambian
      # las fotos, el re-render reutiliza el audio y no gasta créditos de ElevenLabs.
      - name: Clave de la voz
        id: clave
        run: |
          id=$(basename "${{ matrix.guion }}" .json)
          h=$(jq -c '[.narrador, .modelo_voz, [.escenas[].narracion]]' "${{ matrix.guion }}" | sha256sum | cut -c1-16)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "hash=$h" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: public/audio/${{ steps.clave.outputs.id }}-*
          key: voz-${{ steps.clave.outputs.id }}-${{ steps.clave.outputs.hash }}

      - name: Imágenes, voz y render
        env:
          ELEVENLABS_API_KEY_SEBAS: ${{ secrets.ELEVENLABS_API_KEY_SEBAS }}
          ELEVENLABS_VOICE_ID_SEBAS: ${{ secrets.ELEVENLABS_VOICE_ID_SEBAS }}
          ELEVENLABS_API_KEY_JOHN: ${{ secrets.ELEVENLABS_API_KEY_JOHN }}
          ELEVENLABS_VOICE_ID_JOHN: ${{ secrets.ELEVENLABS_VOICE_ID_JOHN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ESTILO: ${{ inputs.estilo || 'mixto' }}
        run: npx tsx pipeline/producir.ts "${{ matrix.guion }}"

      - name: Subir a Google Drive
        env:
          RCLONE_CONFIG_DRIVE_TYPE: drive
          RCLONE_CONFIG_DRIVE_SCOPE: drive
          RCLONE_CONFIG_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          RCLONE_CONFIG_DRIVE_ROOT_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
        run: |
          id=$(basename "${{ matrix.guion }}" .json)
          fecha=${id:0:10}
          echo "Probando acceso a la carpeta de Drive..."
          rclone lsd drive: -vv 2>&1 | grep -viE "token|bearer" || { echo "::error::rclone no pudo leer la carpeta de Drive (token o DRIVE_FOLDER_ID)"; exit 1; }
          rclone copy out/ "drive:$fecha/" --include "$id-*.mp4" --include "$id-*.descripcion.txt" -v

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ${{ hashFiles(matrix.guion) }}
          path: |
            out/*.mp4
            out/*.descripcion.txt
            guiones/*.json
          retention-days: 7
