name: Generar sonidos

# Corre a mano una sola vez: crea los efectos y la música del estilo documental
# con ElevenLabs y los guarda en public/sonidos/ dentro del repo.
on:
  workflow_dispatch:
    inputs:
      rehacer:
        description: "Volver a generar aunque ya existan (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  sonidos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Generar con ElevenLabs
        env:
          ELEVENLABS_API_KEY_JOHN: ${{ secrets.ELEVENLABS_API_KEY_JOHN }}
          ELEVENLABS_API_KEY_SEBAS: ${{ secrets.ELEVENLABS_API_KEY_SEBAS }}
        run: npx tsx pipeline/sonidos.ts ${{ inputs.rehacer == 'true' && '--rehacer' || '' }}
      - name: Guardar en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/sonidos
          git diff --cached --quiet && { echo "Nada nuevo"; exit 0; }
          git commit -m "Sonidos del estilo documental [skip ci]"
          git pull --rebase -q && git push
